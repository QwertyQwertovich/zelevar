<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Potion Brewer</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1340">
<style>
:root {
  --bg1:#1b1340; --bg2:#0b0a1f; --panel:rgba(255,255,255,.07); --panel-b:rgba(255,255,255,.14);
  --fg:#f3efff; --muted:#a9a2c9; --gold:#ffcf4a; --acc:#8f6bff; --acc2:#3fd6c4; --danger:#ff5d73;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; overflow:hidden; color:var(--fg); font-family:"Segoe UI",Roboto,system-ui,sans-serif; user-select:none; -webkit-user-select:none; }
body { background:radial-gradient(60% 40% at 85% 100%, var(--bg3, transparent), transparent), radial-gradient(120% 80% at 50% 0%, var(--bg1), var(--bg2)); }
#bg::before { content:''; position:absolute; inset:-30%; opacity:0; transition:opacity .6s;
  background:linear-gradient(115deg,transparent 30%,rgba(46,230,168,.22) 42%,rgba(120,90,255,.22) 52%,rgba(46,230,168,.12) 60%,transparent 72%);
  animation:aur 14s ease-in-out infinite alternate; }
body.th-aurora #bg::before { opacity:1; }
@keyframes aur { from { transform:translateX(-12%) rotate(-6deg); } to { transform:translateX(12%) rotate(6deg); } }
body.th-embers #bg span.p-bubbles { background:radial-gradient(circle at 40% 40%, rgba(255,170,70,.85), rgba(255,70,20,.05) 60%); }
body.th-candy #bg span.p-bubbles { background:radial-gradient(circle at 30% 30%, rgba(255,170,230,.75), rgba(255,120,200,.05) 60%); }
body.th-forest #bg span.p-bubbles { background:radial-gradient(circle at 40% 40%, rgba(220,255,120,.8), rgba(150,255,80,.04) 55%); }
.tw { position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; animation:twk 2.5s ease-in-out infinite alternate; }
button { font:inherit; color:inherit; border:none; cursor:pointer; }
#bg { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
#bg span { position:absolute; bottom:-40px; border-radius:50%; background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), rgba(255,255,255,.04) 60%); animation:rise linear infinite; }
@keyframes rise { to { transform:translateY(-115vh) translateX(var(--dx)); } }

.screen { position:fixed; inset:0; display:flex; flex-direction:column; }
.screen[hidden] { display:none; }

/* ---------- Главный экран ---------- */
#home { padding:max(16px, env(safe-area-inset-top)) 16px 0; }
.logo { text-align:center; margin-top:18px; }
.logo h1 { margin:0; font-size:44px; letter-spacing:1px; background:linear-gradient(180deg,#fff,#c9b6ff 60%,#8f6bff); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 14px rgba(143,107,255,.5)); }
.logo .flaskicons { font-size:30px; letter-spacing:6px; }
.logo p { margin:4px 0 0; color:var(--muted); font-size:14px; }
.stats { display:flex; justify-content:center; gap:10px; margin:16px 0 12px; }
.chip { background:var(--panel); border:1px solid var(--panel-b); border-radius:999px; padding:6px 14px; font-size:15px; display:flex; gap:6px; align-items:center; }
.chip b { color:var(--gold); }
#playBtn { display:block; margin:0 auto 14px; padding:16px 44px; font-size:22px; font-weight:700; border-radius:20px;
  background:linear-gradient(180deg,#a98bff,#6a43f0); box-shadow:0 6px 0 #4423b8, 0 10px 30px rgba(120,80,255,.5); transition:transform .1s; }
#playBtn:active { transform:translateY(4px); box-shadow:0 2px 0 #4423b8; }
#playBtn small { display:block; font-size:14px; font-weight:500; opacity:.85; }
.tabs { display:flex; gap:6px; overflow-x:auto; padding:4px 0 8px; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tabs button { flex:none; background:var(--panel); border:1px solid var(--panel-b); border-radius:12px; padding:8px 12px; font-size:14px; color:var(--muted); }
.tabs button.on { background:var(--acc); color:#fff; border-color:transparent; }
#grid { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(58px,1fr)); gap:8px; padding:4px 2px 24px; align-content:start; }
.lv { position:relative; aspect-ratio:1; border-radius:14px; background:var(--panel); border:1px solid var(--panel-b); display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:700; font-size:17px; }
.lv .st { font-size:10px; letter-spacing:1px; color:var(--gold); height:12px; }
.lv .st i { font-style:normal; color:rgba(255,255,255,.18); }
.lv .tag { position:absolute; top:-5px; right:-4px; font-size:13px; }
.lv.cur { background:linear-gradient(180deg,#a98bff,#6a43f0); border-color:#c9b6ff; animation:pulse 1.6s infinite; }
.lv.hard { border-color:#ff9f43; } .lv.boss { border-color:#ff5d73; background:rgba(255,93,115,.12); }
.lv.lock { opacity:.35; }
.lv.cur.boss, .lv.cur.hard { background:linear-gradient(180deg,#a98bff,#6a43f0); }
@keyframes pulse { 50% { box-shadow:0 0 0 6px rgba(143,107,255,.25); } }
.homebar { display:flex; justify-content:flex-end; gap:8px; position:absolute; top:max(12px, env(safe-area-inset-top)); right:12px; }
.iconbtn { width:44px; height:44px; border-radius:14px; background:var(--panel); border:1px solid var(--panel-b); font-size:20px; display:flex; align-items:center; justify-content:center; }
.iconbtn:active { transform:scale(.92); }

/* ---------- Игра ---------- */
#game { padding-top:max(8px, env(safe-area-inset-top)); }
.topbar { display:flex; align-items:center; gap:8px; padding:6px 12px; }
.topbar .mid { flex:1; text-align:center; }
.topbar .lvl { font-size:20px; font-weight:700; }
.topbar .sub { font-size:12px; color:var(--muted); min-height:16px; }
.role { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:8px; margin-left:6px; vertical-align:middle; }
.role.hard { background:#ff9f43; color:#2a1600; } .role.boss { background:var(--danger); color:#fff; } .role.blitz { background:var(--acc2); color:#002a26; }
#timer { height:8px; margin:2px 16px 0; border-radius:4px; background:rgba(255,255,255,.1); overflow:hidden; }
#timer[hidden] { display:none; }
#timer div { height:100%; background:linear-gradient(90deg,var(--acc2),#9dffb0); transition:width .25s linear; }
#timer.low div { background:linear-gradient(90deg,var(--danger),#ff9f43); }
#board { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:calc(var(--uh)*0.2); padding:calc(var(--uh)*1) 12px 8px; position:relative; }
.row { display:flex; justify-content:center; align-items:stretch; }
.slot { display:flex; align-items:flex-end; justify-content:center; padding:calc(var(--uh)*0.7) calc(var(--uh)*0.21) 0; touch-action:none; cursor:pointer; }
.slot .flask { pointer-events:none; }
.bottombar { display:flex; justify-content:center; gap:14px; padding:10px 16px max(18px, env(safe-area-inset-bottom)); }
.tool { width:64px; height:64px; border-radius:20px; background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05)); border:1px solid var(--panel-b);
  display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:24px; position:relative; box-shadow:0 4px 0 rgba(0,0,0,.25); }
.tool span { font-size:10px; color:var(--muted); margin-top:2px; }
.tool:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.25); }
.tool:disabled { opacity:.35; }

/* ---------- Колба ---------- */
.flask { position:relative; width:calc(var(--uh)*1.3); display:flex; flex-direction:column; align-items:center; transition:transform .18s cubic-bezier(.3,1.5,.5,1); transform-origin:50% 0; cursor:pointer; }
.flask.sel { transform:translateY(calc(var(--uh)*-0.6)); }
.neck { width:62%; height:calc(var(--uh)*0.5); border:2px solid rgba(255,255,255,.45); border-bottom:none; border-top:none; background:rgba(255,255,255,.06); position:relative; }
.neck::before { content:''; position:absolute; left:-18%; right:-18%; top:-4px; height:7px; border-radius:4px; background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.3)); }
.flask.funnel .neck { width:100%; height:calc(var(--uh)*0.55); border:none; background:none; }
.flask.funnel .neck::before { left:-8%; right:-8%; top:auto; bottom:0; height:100%; border-radius:0; background:linear-gradient(180deg,rgba(255,215,120,.6),rgba(255,215,120,.15)); clip-path:polygon(0 0,100% 0,72% 100%,28% 100%); }
.body { position:relative; width:100%; border:2px solid rgba(255,255,255,.45); border-radius:6px 6px calc(var(--uh)*0.62) calc(var(--uh)*0.62); overflow:hidden;
  background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 40%,rgba(255,255,255,.08)); box-shadow:inset 0 -6px 14px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.25); }
.flask.funnel .body { border-color:rgba(255,215,120,.65); }
.flask.done .body { border-color:rgba(160,255,190,.85); box-shadow:0 0 18px rgba(120,255,170,.35), inset 0 -6px 14px rgba(0,0,0,.25); }
.flask.hintsrc .body, .flask.hintdst .body { animation:hintglow .9s infinite; }
@keyframes hintglow { 50% { border-color:var(--gold); box-shadow:0 0 22px rgba(255,207,74,.8); } }
.gloss { position:absolute; left:16%; width:13%; top:6%; bottom:14%; border-radius:99px; background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08)); pointer-events:none; z-index:3; }
.u { position:absolute; left:0; right:0; transition-property:height; transition-timing-function:linear; }
.u.top::after { content:''; position:absolute; left:3%; right:3%; top:calc(var(--uh)*-0.09); height:calc(var(--uh)*0.18); border-radius:50%; background:var(--hl); animation:wave 2.4s ease-in-out infinite; }
@keyframes wave { 50% { transform:scaleX(.92) translateY(1px); } }
.u.hid { background:repeating-linear-gradient(45deg,#2c2347 0 6px,#352a56 6px 12px) !important; display:flex; align-items:center; justify-content:center; font-weight:800; color:#b9a8ff; font-size:calc(var(--uh)*0.5); box-shadow:inset 0 1px 0 rgba(255,255,255,.08); }
.u.hid::after { display:none; }
.u .g { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:calc(var(--uh)*0.42); color:rgba(0,0,0,.42); }
.u.reveal { animation:reveal .45s ease; }
@keyframes reveal { 0% { transform:scaleX(0); filter:brightness(2.5); } 100% { transform:scaleX(1); } }
.stone { position:absolute; left:0; right:0; bottom:0; background:radial-gradient(ellipse at 40% 30%,#9d9aa8,#5b5866 60%,#3c3a45); border-top:2px solid #7c7988; }
.cork { position:absolute; top:calc(var(--uh)*-0.42); width:52%; height:calc(var(--uh)*0.62); border-radius:5px 5px 3px 3px; background:linear-gradient(90deg,#8a5a2b,#c88a4a 40%,#8a5a2b); box-shadow:0 2px 0 rgba(0,0,0,.3); z-index:4; }
.cork.drop { animation:corkdrop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes corkdrop { from { transform:translateY(calc(var(--uh)*-2)) rotate(-25deg); opacity:0; } }
.flask.bounce { animation:bounce .6s ease; }
@keyframes bounce { 30% { transform:translateY(calc(var(--uh)*-0.7)); } 60% { transform:translateY(0); } 80% { transform:translateY(calc(var(--uh)*-0.15)); } }
.flask.shake { animation:shake .35s; }
@keyframes shake { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }

/* лёд */
.ice { position:absolute; left:-3px; right:-3px; bottom:-3px; border-radius:8px 8px calc(var(--uh)*0.66) calc(var(--uh)*0.66); z-index:5;
  background:linear-gradient(160deg,rgba(220,245,255,.78),rgba(150,210,255,.55) 45%,rgba(200,240,255,.72)); border:2px solid rgba(235,250,255,.9);
  box-shadow:inset 0 0 18px rgba(255,255,255,.7); display:flex; align-items:center; justify-content:center; }
.ice::before { content:''; position:absolute; inset:0; background:
  linear-gradient(115deg,transparent 46%,rgba(255,255,255,.9) 47%,transparent 49%),
  linear-gradient(60deg,transparent 60%,rgba(255,255,255,.7) 61%,transparent 63%),
  linear-gradient(150deg,transparent 30%,rgba(255,255,255,.6) 31%,transparent 33%); border-radius:inherit; }
.ice b { position:relative; background:#2d7bd6; color:#fff; border-radius:999px; padding:2px 8px; font-size:calc(var(--uh)*0.38); box-shadow:0 2px 6px rgba(0,0,0,.3); }
.ice.melt { animation:melt .7s forwards; }
@keyframes melt { to { opacity:0; transform:scale(1.15); filter:blur(4px); } }

/* замок */
.chains { position:absolute; inset:-4px; z-index:5; display:flex; align-items:center; justify-content:center; pointer-events:none;
  background:rgba(25,15,55,.45); border-radius:8px 8px calc(var(--uh)*0.66) calc(var(--uh)*0.66); }
.chains::before, .chains::after { content:''; position:absolute; left:-45%; right:-45%; height:calc(var(--uh)*0.24); top:46%;
  background:repeating-linear-gradient(90deg,#d8d4e6 0 8px,#8d88a3 8px 10px,#bdb8cf 10px 18px,#6f6a85 18px 20px); border-radius:6px; box-shadow:0 2px 4px rgba(0,0,0,.4); }
.chains::before { transform:rotate(62deg); } .chains::after { transform:rotate(-62deg); }
.padlock { position:relative; z-index:2; width:calc(var(--uh)*0.95); height:calc(var(--uh)*0.8); border-radius:8px; background:var(--lc); display:flex; align-items:center; justify-content:center;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.25), 0 3px 8px rgba(0,0,0,.45); margin-top:calc(var(--uh)*0.3); font-size:calc(var(--uh)*0.42); color:rgba(0,0,0,.5); }
.padlock::before { content:''; position:absolute; bottom:88%; width:56%; height:calc(var(--uh)*0.45); border:calc(var(--uh)*0.1) solid #d7d3e5; border-bottom:none; border-radius:99px 99px 0 0; }
.chains.open { animation:unchain .8s forwards; }
@keyframes unchain { 30% { transform:rotate(-8deg) scale(1.1); } 100% { transform:translateY(calc(var(--uh)*-3)) rotate(20deg); opacity:0; } }
.badge { position:absolute; bottom:calc(var(--uh)*-0.55); font-size:calc(var(--uh)*0.32); color:var(--muted); white-space:nowrap; }

/* фильтр */
.flask.filt .neck { border-color:var(--fc); border-width:3px; border-top:none; border-bottom:none; background:linear-gradient(180deg,rgba(255,255,255,.05),var(--fc)); }
.flask.filt .neck::before { background:var(--fc); box-shadow:0 0 10px var(--fc); }
.flask.filt .body { border-top:3px solid var(--fc); }
.badge .dot { display:inline-block; width:.8em; height:.8em; border-radius:50%; margin-right:3px; vertical-align:-1px; }
/* кран */
.spout { position:absolute; bottom:calc(var(--uh)*0.25); right:calc(var(--uh)*-0.34); width:calc(var(--uh)*0.44); height:calc(var(--uh)*0.3);
  background:linear-gradient(180deg,#e8e4f4,#9a95ad); border-radius:3px 8px 8px 3px; box-shadow:0 2px 4px rgba(0,0,0,.4); z-index:4; }
.spout::after { content:''; position:absolute; right:2px; top:100%; width:40%; height:calc(var(--uh)*0.18); background:#9a95ad; border-radius:0 0 3px 3px; }
.spout::before { content:''; position:absolute; left:28%; bottom:100%; width:44%; height:calc(var(--uh)*0.2); background:#d23f57; border-radius:3px 3px 0 0; }
.flask.tapf .body { border-color:rgba(200,220,255,.8); }
/* печать */
.sealbox { position:absolute; top:calc(var(--uh)*-0.3); left:0; right:0; z-index:6; display:flex; flex-direction:column; align-items:center; pointer-events:none; }
.stopper { width:56%; height:calc(var(--uh)*0.75); border-radius:5px 5px 3px 3px; background:linear-gradient(90deg,#6b4521,#a8743f 40%,#6b4521); }
.seal { margin-top:calc(var(--uh)*-0.35); width:calc(var(--uh)*0.95); height:calc(var(--uh)*0.95); border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff6b6b,#b3122a 65%,#7d0b1c); filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));
  display:flex; align-items:center; justify-content:center;
  clip-path:polygon(50% 0,61% 9%,75% 4%,80% 18%,95% 22%,92% 37%,100% 50%,92% 63%,95% 78%,80% 82%,75% 96%,61% 91%,50% 100%,39% 91%,25% 96%,20% 82%,5% 78%,8% 63%,0 50%,8% 37%,5% 22%,20% 18%,25% 4%,39% 9%); }
.seal b { color:#ffe1e1; font-size:calc(var(--uh)*0.44); text-shadow:0 1px 2px rgba(0,0,0,.6); }
.sealbox.open { animation:unseal .8s forwards; }
@keyframes unseal { 30% { transform:scale(1.15); } 100% { transform:translateY(calc(var(--uh)*-2.5)) rotate(-30deg); opacity:0; } }

/* ---------- дизайны из лавки ---------- */
.sk-vial .body { border-radius:8px 8px 12px 12px; }
.sk-vial .neck { width:74%; height:calc(var(--uh)*0.35); }
.sk-potion .body { border-radius:calc(var(--uh)*0.6) calc(var(--uh)*0.6) calc(var(--uh)*0.55) calc(var(--uh)*0.55); }
.sk-potion .neck { width:42%; height:calc(var(--uh)*0.62); }
.sk-crystal .body { border-radius:3px 3px 45% 45% / 3px 3px 20% 20%; border-color:rgba(160,240,255,.9);
  background:linear-gradient(115deg,rgba(255,255,255,.2) 0 18%,rgba(255,255,255,.04) 18% 52%,rgba(255,255,255,.15) 52% 60%,rgba(255,255,255,.03) 60%); }
.sk-crystal .neck { border-color:rgba(160,240,255,.9); }
.sk-crystal .neck::before { background:linear-gradient(180deg,#e9fdff,#7fd8ff); }
.sk-golden .body, .sk-golden .neck { border-color:#e8c25a; }
.sk-golden .body { box-shadow:0 0 0 1px #7a5a12, inset 0 -6px 14px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.3); }
.sk-golden .neck::before { background:linear-gradient(180deg,#fff2b0,#c9962a); }
.sk-frost .body { border:3px solid rgba(235,248,255,.95); background:linear-gradient(90deg,rgba(220,240,255,.24),rgba(255,255,255,.06) 40%,rgba(220,240,255,.2)); box-shadow:inset 0 0 14px rgba(220,240,255,.5), 0 6px 18px rgba(0,0,0,.25); }
.sk-frost .neck { border-color:rgba(235,248,255,.95); }
.sk-neon .body, .sk-neon .neck { animation:neonb 6s linear infinite; }
@keyframes neonb { 0%,100% { border-color:#7af; box-shadow:0 0 12px #7af; } 33% { border-color:#f7c; box-shadow:0 0 12px #f7c; } 66% { border-color:#6fd; box-shadow:0 0 12px #6fd; } }
.lq-matte .u:not(.hid) { background:var(--c) !important; }
.lq-matte .u.top::after { background:var(--cl); }
.lq-neon .u:not(.hid) { filter:saturate(1.5) brightness(1.15); box-shadow:inset 0 0 calc(var(--uh)*0.35) rgba(255,255,255,.45); }
.lq-bubbly .u:not(.hid)::before { content:''; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(circle,rgba(255,255,255,.75) 0 1.5px,transparent 2.5px),radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 2px);
  background-size:13px 17px, 9px 23px; background-position:2px 0, 7px 5px; animation:fizz 1.8s linear infinite; }
@keyframes fizz { to { background-position:2px -34px, 7px -41px; } }
.lq-marble .u:not(.hid) { background:repeating-linear-gradient(115deg,var(--c) 0 9px,var(--cl) 9px 12px,var(--c) 12px 20px,var(--cd) 20px 22px) !important; }
.lq-galaxy .u:not(.hid)::before { content:''; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(circle,#fff 0 1px,transparent 1.6px),radial-gradient(circle,rgba(255,255,255,.85) 0 .8px,transparent 1.4px);
  background-size:17px 13px, 11px 19px; background-position:3px 4px, 8px 1px; animation:twk 2.4s ease-in-out infinite alternate; }
@keyframes twk { from { opacity:.25; } to { opacity:1; } }
.ck-wax .cork { border-radius:50% 50% 30% 30%; background:radial-gradient(circle at 35% 30%,#ff6b6b,#b3122a 65%,#7d0b1c); height:calc(var(--uh)*0.5); width:62%; top:calc(var(--uh)*-0.3); }
.ck-gem .cork { background:linear-gradient(135deg,#e6fdff,#48c6ff 45%,#2a5bd7); clip-path:polygon(50% 0,100% 40%,78% 100%,22% 100%,0 40%); height:calc(var(--uh)*0.85); top:calc(var(--uh)*-0.7); box-shadow:none; }
.ck-gold .cork { border-radius:calc(var(--uh)*0.3) calc(var(--uh)*0.3) 3px 3px; background:linear-gradient(90deg,#9a6c12,#ffe08a 40%,#b9851f); overflow:visible; }
.ck-gold .cork::after { content:''; position:absolute; left:35%; right:35%; top:calc(var(--uh)*-0.2); height:calc(var(--uh)*0.24); border-radius:50%; background:#ffe08a; }
.ck-flower .cork { background:radial-gradient(circle,#ffe08a 0 22%,#ff7ac8 24% 60%,transparent 62%); border-radius:50%; width:calc(var(--uh)*1.05); height:calc(var(--uh)*1.05); top:calc(var(--uh)*-0.75); box-shadow:none; }

/* лавка */
.shopbtn { display:block; margin:-2px auto 12px; padding:9px 20px; border-radius:14px; background:linear-gradient(180deg,rgba(255,207,74,.22),rgba(255,207,74,.08)); border:1px solid rgba(255,207,74,.45); font-size:15px; font-weight:700; }
.shopbtn:active { transform:scale(.96); }
.card.shop { max-width:440px; padding:18px 14px 16px; overflow-x:hidden; }
.shophead { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.shophead h2 { margin:0; }
.stabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none; }

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; } else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
let UNIT_BG, UNIT_HL, UNIT_CL, UNIT_CD;
function setPalette(colors) {

  UNIT_HL = PAL.map(h => shade(h, .45)); UNIT_CL = PAL.map(h => shade(h, .35)); UNIT_CD = PAL.map(h => shade(h, -.3));
}

// ---------- Сохранение прогресса: код или файл ----------
// Формат: ZLV1.<base64 от JSON сохранения>.<контрольная сумма> — так испорченный при копировании код не загрузится
const IN_APP = typeof window.AndroidBridge !== 'undefined';
function chk(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function exportCode() {
  const b = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  return 'ZLV1.' + b + '.' + chk(b);
}
function parseCode(code) {
  const m = String(code).replace(/\s+/g, '').match(/^ZLV1\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/);
  if (!m || chk(m[1]) !== m[2]) return null;
  try { const d = JSON.parse(decodeURIComponent(escape(atob(m[1])))); return d && typeof d === 'object' && d.stars ? d : null; } catch (e) { return null; }
}
async function copyText(text, area) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try { area.focus(); area.select(); return document.execCommand('copy'); } catch (e) { return false; }
}

const APP_VERSION = '2.3.2';

const verNum = v => String(v).replace(/^v/i, '').split('.').map(x => parseInt(x, 10) || 0);
function isNewer(a, b) { const x = verNum(a), y = verNum(b); for (let q = 0; q < Math.max(x.length, y.length); q++) { const d = (x[q] || 0) - (y[q] || 0); if (d) return d > 0; } return false; }

// Тот же уровень, но другие цвета и другой порядок колб: решаемость не меняется
function remixLevel(L, rnd) {
  rnd = rnd || Math.random;
  const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const used = new Set();
  L.start.forEach(a => a.forEach(u => used.add(Core.col(u))));
  L.flasks.forEach(f => { if (f.lock >= 0) used.add(f.lock); if (f.filter >= 0) used.add(f.filter); });
  const pool = shuf([...Array(Core.PALETTE_SIZE).keys()]), map = {};
  [...used].forEach((c, i) => map[c] = pool[i]);
  if (L.cnt) { const nc = {}; for (const c in L.cnt) nc[map[c]] = L.cnt[c]; L.cnt = nc; }
  if (L.heavy >= 0) L.heavy = map[L.heavy];
  if (L.order) L.order = L.order.map(c => map[c]);
  L.start = L.start.map(a => a.map(u => (u & Core.HID) | map[Core.col(u)]));
  L.flasks.forEach(f => { if (f.lock >= 0) f.lock = map[f.lock]; if (f.filter >= 0) f.filter = map[f.filter]; });
  const perm = shuf(L.flasks.map((f, i) => i));
  L.flasks = perm.map(i => L.flasks[i]); L.start = perm.map(i => L.start[i]);
}

function layout() {
  const b = $('board'), W = b.clientWidth - 24, H = b.clientHeight - 20, N = L.flasks.length;
  const maxCap = Math.max(...L.flasks.map(f => f.cap + (f.stone ? 1 : 0)));
  let best = { uh:0, rows:1 };
  for (let r = 1; r <= 3; r++) {
    const per = Math.ceil(N / r);
    const uhW = W / (per * 1.72);
    const uhH = H / (r * (maxCap + 0.5 + 0.9) + 1.2);
    const uh = Math.min(uhW, uhH, 50);
    if (uh > best.uh + 0.5) best = { uh, rows:r };
  }
  UH = Math.floor(best.uh);
  b.style.setProperty('--uh', UH + 'px');
  const rows = []; let idx = 0;
  for (let r = 0; r < best.rows; r++) { const cnt = Math.ceil((N - idx) / (best.rows - r)); rows.push([...Array(cnt).keys()].map(k => k + idx)); idx += cnt; }
  return rows;
}

function unitEl(u, k, off, top, done, reveal) {

  else { e.style.background = UNIT_BG[c]; e.style.setProperty('--hl', UNIT_HL[c]); e.style.setProperty('--c', PAL[c]); e.style.setProperty('--cl', UNIT_CL[c]); e.style.setProperty('--cd', UNIT_CD[c]); if (S.glyph) e.innerHTML = '<div class="g">' + GLYPH[c] + '</div>'; }

function unitBottom(k, off) { return (k === 0 && !off) ? 0 : (k + off) * UH + UH * 0.18; }
function unitHeight(k, off) { return UH + (k === 0 && !off ? UH * 0.18 : 0) + 0.5; }

function srcProblem(i) {
  const done = Core.doneMask(L, st), F = L.flasks[i], a = st.f[i];
  if (Core.frozen(L, st, i)) return tr('iceLeft', F.ice - st.moves);
  if (Core.locked(L, i, done)) return tr('locked');
  if (Core.sealed(L, i, done)) { const k = F.seal - Core.popcount(done); return tr('sealLeft', k); }
  if (!a.length) return '';
  if (Core.cracked(L, st, i)) return tr('crackedMsg');
  if (F.type === 'f') return tr('funnelNo');
  if (Core.flaskDone(L, a, done)) return '';
  if (Core.frostOn(L, st, i) && Core.outRun(L, a, i, st) === 0) return tr('frostLeft', F.frost - st.moves);
  return null;
}
function plural(n, a, b, c) { n = Math.abs(n) % 100; const m = n % 10; return n > 10 && n < 20 ? c : m === 1 ? a : m >= 2 && m <= 4 ? b : c; }
function shakeEl(i) { const e = els[i]; if (!e || inFlight.has(i)) return; e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }

function clearHint() { if (!hint) return; hint.forEach(q => els[q] && els[q].classList.remove('hintsrc', 'hintdst')); hint = null; }

function tap(i) {

    else { shakeEl(i); snd.err(); if (p) toast(p); }
    return;

  if (sel === i) { setSel(-1); return; }
  const why = Core.whyNot(L, st, sel, i);
  if (why === null) { const s = sel; setSel(-1); commitPour(s, i); return; }
  if ((why === 'color' || why === 'full' || why === 'filter') && srcProblem(i) === null) { setSel(i); snd.tap(); return; }
  shakeEl(i); snd.err(); vib([20, 40, 20]);
  if (why === 'ice' || why === 'lock' || why === 'seal' || why === 'crack' || why === 'frost') toast(srcProblem(i) || srcProblem(sel) || tr('cantTouch'));
  else if (why === 'full') toast(tr('full'));
  else if (why === 'filter') toast(tr('filterOnly'));
  else if (why === 'color') toast(tr('sameColor'));
  setSel(-1);
}

function commitPour(i, j) {
  const before = Core.doneMask(L, st), cntB = Core.popcount(before);
  hist.push(Core.cloneState(st));
  const color = Core.outColor(L, i, st.f[i]);
  const mv = Core.pour(L, st, i, j);
  const after = Core.doneMask(L, st), cntA = Core.popcount(after);
  const fx = {
    unlock: L.flasks.map((F, q) => F.lock >= 0 && !((before >> F.lock) & 1) && ((after >> F.lock) & 1) ? q : -1).filter(q => q >= 0),
    unseal: L.flasks.map((F, q) => F.seal && cntB < F.seal && cntA >= F.seal ? q : -1).filter(q => q >= 0),
    thaw: L.flasks.map((F, q) => (F.ice && F.ice === st.moves) || (F.frost && F.frost === st.moves) || (F.bomb > 0 && F.bomb === st.moves) ? q : -1).filter(q => q >= 0),
  };
  updHeader(); updOverlays();
  if (Core.won(L, st)) { endState = 'win'; setSel(-1); }
  else if (Core.exploded(L, st)) { endState = 'boom'; setSel(-1); }
  else if (L.limit && st.moves >= L.limit) endState = 'moves';
  const tk = token, rotQ = [...new Set(mv.rot.map(r => r[0]))].filter(q => q !== i && q !== j);
  anims++;
  const p = Promise.all([ready[i], ready[j], ...rotQ.map(q => ready[q])])
    .then(() => tk === token ? animatePour(i, j, mv, color, tk) : null)
    .catch(e => console.error(e))
    .then(() => {
      if (tk !== token) return;
      anims--;
      [...new Set(fx.unlock.concat(fx.unseal, fx.thaw))].forEach(q => renderFlask(q, fx));
      if (fx.unlock.length || fx.unseal.length) { snd.unlock(); vib(40); }
      if (fx.thaw.length) snd.thaw();
      if (!anims) idle();
    });
  ready[i] = ready[j] = p; rotQ.forEach(q => ready[q] = p);
}

function idle() {
  if (endState === 'win') win();
  else if (endState === 'boom') boomOut();
  else if (endState === 'moves') movesOut();
  else checkStuck();
}
// Проверка «осмысленных ходов»: решатель ищет путь к победе из текущей позиции.
// Если ходов нет вовсе или решения точно нет — показываем экран тупика.
let stuckTimer = null;
function checkStuck() {
  clearTimeout(stuckTimer);
  if (endState) return;
  if (!anyMove()) return showStuck();
  const tk = token, moves = st.moves, f = JSON.stringify(st.f);
  stuckTimer = setTimeout(() => {
    if (tk !== token || anims || endState || busy || st.moves !== moves || JSON.stringify(st.f) !== f) return;
    const r = Core.solve(L, st, 80000);
    if (!r.path && !r.aborted) showStuck();
  }, 350);
}
function showStuck() {
  if (endState) return;
  endState = 'stuck'; snd.lose(); vib([60, 40, 60]);
  const cost = freeMode() ? 0 : PRICE.add, undoCost = freeMode() || undosUsed < FREE_UNDO ? 0 : PRICE.undo;
  modal(`<div class="mrow">${mascot('sad', 80)}</div><h2>${tr('stuckTitle')}</h2><p>${tr(anyMove() ? 'stuckNoWin' : 'stuckNoMoves')}</p>
    <div class="btns" style="flex-direction:column;align-items:stretch">
      ${hist.length ? `<button class="btn" id="sUndo">↶ ${tr('undoMove')}${undoCost ? ' · ' + undoCost + ' ⭐' : ''}</button>` : ''}
      ${usedExtra ? '' : `<button class="btn" id="sAdd">➕ ${tr('addFlask')}${cost ? ' · ' + cost + ' ⭐' : ''}</button>`}
      <button class="btn pri" id="sAgain">↻ ${tr('restart')}</button>
      <button class="btn" id="sMenu">${tr('menu')}</button></div>`, 'locked');

  $('sAgain').onclick = () => { closeModal(false); restart(); };
  $('sMenu').onclick = () => { closeModal(false); leaveGame(); };
}

async function animatePour(i, j, mv, color, tk) {
  const n = mv.n, k = SPD(), tapF = L.flasks[i].type === 't';
  const se = els[i], de = els[j];
  const lifted = se.classList.contains('sel');
  inFlight.add(i); inFlight.add(j);
  se.classList.remove('sel', 'shake', 'hintsrc', 'hintdst'); de.classList.remove('shake');
  const lift = lifted ? -UH * 0.6 : 0;
  const sr = se.getBoundingClientRect(), dr = de.getBoundingClientRect();
  const baseTop = sr.top - lift;
  const scx = sr.left + sr.width / 2, dcx = dr.left + dr.width / 2;
  const dir = dcx >= scx ? 1 : -1;
  let mouthX, mouthY, tilt, mid;
  if (tapF) {   // колба с краном зависает над целью и сливает снизу
    mouthX = dcx; mouthY = dr.top - UH * 0.35;
    const tx = dcx - scx, ty = mouthY - (baseTop + sr.height) - UH * 0.15;
    tilt = `translate(${tx}px,${ty}px)`; mid = `translate(${tx * 0.6}px,${ty - UH}px)`;
  } else {
    const ang = 74 * dir;
    mouthX = dcx - dir * sr.width * 0.1; mouthY = dr.top - sr.width * 0.62 - UH * 0.25;
    const tx = mouthX - scx, ty = mouthY - baseTop;
    tilt = `translate(${tx}px,${ty}px) rotate(${ang}deg)`; mid = `translate(${tx}px,${ty}px) rotate(${ang * 0.25}deg)`;
  }
  se.style.zIndex = 30; se.style.transition = 'none';
  const a1 = se.animate([{ transform:`translate(0,${lift}px)` }, { transform:mid, offset:.55 }, { transform:tilt }],
    { duration:400 * k, easing:'ease-in-out', fill:'forwards' });
  await settle(a1, 400 * k);
  if (tk !== token) return;

  // струя
  const b = view[j], dOff = L.flasks[j].stone ? 1 : 0, dBodyEl = de.querySelector('.body'), dBody = dBodyEl.getBoundingClientRect();
  const surf = dBody.bottom - unitBottom(b.length + n, dOff);
  const sw = Math.max(4, UH * 0.2);
  const stream = document.createElement('div'); stream.className = 'stream';
  stream.style.cssText = `left:${mouthX - sw / 2}px;top:${mouthY}px;width:${sw}px;height:${Math.max(10, surf - mouthY)}px;background:${UNIT_BG[Core.col(color)]}`;
  $('fx').appendChild(stream);
  stream.animate([{ transform:'scaleY(0)' }, { transform:'scaleY(1)' }], { duration:110 * k, easing:'ease-out' });
  const pourMs = (240 + n * 130) * k, per = pourMs / n;
  snd.pour(pourMs / 1000); vib(12);

  // уровни жидкости
  const sUnits = [...se.querySelectorAll('.u')], sOff = L.flasks[i].stone ? 1 : 0;
  if (tapF) {
    sUnits.slice(0, n).forEach((u, q) => { u.style.transition = `height ${per}ms linear ${q * per}ms`; requestAnimationFrame(() => u.style.height = '0px'); });
    sUnits.slice(n).forEach((u, q) => { u.style.transition = `bottom ${pourMs}ms linear`; requestAnimationFrame(() => u.style.bottom = unitBottom(q, sOff) + 'px'); });
  } else {
    sUnits.slice(-n).reverse().forEach((u, q) => { u.style.transition = `height ${per}ms linear ${q * per}ms`; u.classList.remove('top'); requestAnimationFrame(() => u.style.height = '0px'); });
  }
  const gl = dBodyEl.querySelector('.gloss'), oldTop = dBodyEl.querySelector('.u.top');
  if (oldTop && !mv.sink && !mv.flip) oldTop.classList.remove('top');
  for (let q = 0; q < (mv.sink || mv.flip ? 0 : n); q++) {
    const u = unitEl(color, b.length + q, dOff, q === n - 1, false, false), full = u.style.height;
    u.style.height = '0px'; u.style.transition = `height ${per}ms linear ${q * per}ms`;
    dBodyEl.insertBefore(u, gl);
    requestAnimationFrame(() => requestAnimationFrame(() => u.style.height = full));
  }
  await wait(pourMs + 40);
  stream.style.transformOrigin = '50% 100%';
  const sEnd = stream.animate([{ transform:'scaleY(1)' }, { transform:'scaleY(0)' }], { duration:120 * k, fill:'forwards' });
  const a2 = se.animate([{ transform:tilt }, { transform:'translate(0,0) rotate(0deg)' }], { duration:320 * k, easing:'ease-in-out' });
  a1.cancel();
  await settle(sEnd, 120 * k); stream.remove();
  await settle(a2, 320 * k);
  if (tk !== token) return;
  se.style.zIndex = ''; se.style.transition = '';

  // применяем ход к нарисованному состоянию
  const moved = tapF ? view[i].splice(0, n) : view[i].splice(-n);
  if (mv.sink) view[j].unshift(...moved); else view[j].push(...moved);
  if (mv.rev) view[i][view[i].length - 1] -= Core.HID;
  if (mv.flip) { const b2 = view[j]; b2.reverse(); if (mv.frev) b2[b2.length - 1] -= Core.HID; }
  for (const [q, r] of mv.rot) { const x = view[q]; x.unshift(x.pop()); if (r) x[x.length - 1] -= Core.HID; }
  inFlight.delete(i); inFlight.delete(j);
  const doneMaskNow = Core.doneMask(L, st);
  const doneJ = Core.complete(view[j], L) && ((doneMaskNow >> Core.col(view[j][0])) & 1) === 1;
  renderFlask(i, { rev: mv.rev, boiled: mv.rot.some(r => r[0] === i) });
  renderFlask(j, { done: doneJ, settle: mv.sink || mv.flip, boiled: mv.rot.some(r => r[0] === j) });
  mv.rot.forEach(([q]) => { if (q !== i && q !== j) renderFlask(q, { boiled: true }); });
  if (mv.rot.length) snd.boil();
  if (mv.rev) snd.reveal();
  if (doneJ) { snd.done(); vib(30); burst(els[j], PAL[Core.col(view[j][0])]); }
}

function anyMove() {
  const done = Core.doneMask(L, st);
  for (let i = 0; i < st.f.length; i++) for (let j = 0; j < st.f.length; j++) if (Core.canPour(L, st, i, j, done)) return true;
  return false;
}

function burst(el, color) {
  if (!el) return;
  const kind = eq('fx'), r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + UH * 0.3;
  const glyphs = { stars:'★', hearts:'♥', notes:'♪♫' }[kind];
  const count = kind === 'fireworks' ? 34 : 16;
  for (let q = 0; q < count; q++) {
    const s = document.createElement('div'); s.className = 'spark';
    const c = q % 3 ? color : '#fff';
    if (glyphs) { s.classList.add('glyph'); s.textContent = glyphs[q % glyphs.length]; s.style.color = kind === 'hearts' && q % 2 ? '#ff6ac1' : c; s.style.fontSize = (12 + Math.random() * 10) + 'px'; }
    else if (kind === 'bubbles') { s.classList.add('ring'); s.style.borderColor = c; const d = 6 + Math.random() * 12; s.style.width = s.style.height = d + 'px'; }
    else s.style.background = c, s.style.boxShadow = '0 0 8px ' + color;
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    $('fx').appendChild(s);
    const ang = Math.random() * Math.PI * 2, dist = (kind === 'fireworks' ? 60 : 30) + Math.random() * (kind === 'fireworks' ? 90 : 60);
    const up = kind === 'bubbles' || kind === 'notes' ? -50 - Math.random() * 40 : -30;
    s.animate([{ transform:'translate(-50%,-50%) scale(1)', opacity:1 },
      { transform:`translate(${Math.cos(ang) * dist - 4}px,${Math.sin(ang) * dist * (kind === 'bubbles' ? .4 : 1) + up}px) scale(${glyphs || kind === 'bubbles' ? .7 : .2})`, opacity:0 }],
      { duration:(kind === 'fireworks' ? 900 : 650) + Math.random() * 350, easing:'cubic-bezier(.2,.8,.3,1)' }).finished.then(() => s.remove());
  }
}

function confetti(ms) {
  const kind = eq('win'), c = $('confetti'), x = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight;
  const P = [...Array(kind === 'confetti' ? 140 : 70)].map(() => {
    const p = { x:W / 2 + (Math.random() - .5) * 60, y:H * .45, vx:(Math.random() - .5) * 14, vy:-6 - Math.random() * 12,
      s:5 + Math.random() * 6, r:Math.random() * 6, vr:(Math.random() - .5) * .3, c:PAL[Math.floor(Math.random() * PAL.length)] };
    if (kind === 'starfall' || kind === 'petals' || kind === 'coins') { p.x = Math.random() * W; p.y = -20 - Math.random() * H * .7; p.vx = (Math.random() - .5) * 2; p.vy = 2.5 + Math.random() * 3; }
    if (kind === 'soap') { p.x = Math.random() * W; p.y = H + 20 + Math.random() * H * .4; p.vx = (Math.random() - .5) * 1.5; p.vy = -2.5 - Math.random() * 3; p.s = 10 + Math.random() * 22; }
    return p;
  });
  const t0 = performance.now();
  (function f(t) {
    x.clearRect(0, 0, W, H);
    for (const p of P) {
      if (kind === 'confetti') { p.vy += .35; p.vx *= .99; }
      else if (kind === 'soap') p.vx += Math.sin((t + p.s * 40) / 300) * .05;
      else { p.vy += .03; p.vx += Math.sin(t / 400 + p.s) * .04; }
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r);
      if (kind === 'starfall') { x.fillStyle = p.s > 8 ? '#ffe08a' : p.c; x.font = (p.s * 2.4) + 'px sans-serif'; x.fillText('★', -p.s, p.s); }
      else if (kind === 'petals') { x.fillStyle = p.s > 8 ? '#ffb3d6' : '#ff7ab8'; x.beginPath(); x.ellipse(0, 0, p.s, p.s / 2, 0, 0, 7); x.fill(); }
      else if (kind === 'coins') { x.scale(Math.abs(Math.cos(p.r * 2)) + .1, 1); x.fillStyle = '#e8b830'; x.beginPath(); x.arc(0, 0, p.s, 0, 7); x.fill(); x.fillStyle = '#ffe58a'; x.beginPath(); x.arc(-p.s * .25, -p.s * .25, p.s * .45, 0, 7); x.fill(); }
      else if (kind === 'soap') { x.rotate(-p.r); x.strokeStyle = 'rgba(220,240,255,.75)'; x.lineWidth = 2; x.beginPath(); x.arc(0, 0, p.s, 0, 7); x.stroke(); x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.arc(-p.s * .35, -p.s * .35, p.s * .18, 0, 7); x.fill(); }
      else { x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
      x.restore();
    }
    if (t - t0 < ms) requestAnimationFrame(f); else x.clearRect(0, 0, W, H);
  })(t0);
}

// Отмена мгновенно обрывает анимации и рисует состояние до последнего хода
function undo() {
  if (busy || !hist.length || endState === 'win') return;
  resetAnims();
  st = hist.pop(); while (st.f.length < L.flasks.length) st.f.push([]);
  view = st.f.map(a => a.slice()); endState = null;
  sel = -1; hint = null; snd.tap(); renderAll();
}
// Первые FREE_UNDO отмен за попытку бесплатны, дальше — за звёзды
function doUndo(force) {
  if ((busy && !force) || !hist.length || endState === 'win') return;
  if (!freeMode() && undosUsed >= FREE_UNDO && !spend(PRICE.undo)) return;
  undosUsed++; busy = false; undo();
}
$('undoBtn').onclick = () => doUndo();
$('restartBtn').onclick = () => { if (!busy || endState) restart(); };
$('backBtn').onclick = leaveGame;
$('addBtn').onclick = () => {
  if (busy || usedExtra || endState) return;
  const cost = freeMode() ? 0 : PRICE.add;
  if (balance() < cost) { snd.err(); return toast(tr('flaskCost', cost)); }
  modal(`<div class="big">🧪</div><h2>${tr('extraQ')}</h2><p>${cost ? tr('extraCost', cost) + ' ' : ''}${tr('extraText')}</p>
    <div class="btns"><button class="btn" id="aNo">${tr('no')}</button><button class="btn pri" id="aYes">${tr('add')}${cost ? ' · ' + cost + ' ⭐' : ''}</button></div>`);
  $('aNo').onclick = () => closeModal();
  $('aYes').onclick = () => { closeModal(); addFlask(); };
};
function addFlask() {
  const cost = freeMode() ? 0 : PRICE.add;
  if (usedExtra || !spend(cost)) return false;
  usedExtra = true; $('addBtn').disabled = true;
  L.flasks.push({ cap:L.U, type:'n', ice:0, lock:-1 }); st.f.push([]); for (const h of hist) h.f.push([]);
  resetAnims(); view = st.f.map(a => a.slice());
  renderAll(); snd.done(); checkStuck();
  return true;
}
$('hintBtn').onclick = () => {
  if (busy || endState) return;
  const cost = freeMode() ? 0 : PRICE.hint;
  if (balance() < cost) { snd.err(); return toast(tr('hintCost', cost)); }
  toast(tr('brewingHint'));
  setTimeout(() => {
    const r = Core.solve(L, st, 400000);
    if (!r.path) { toast(tr('hintFail', r.aborted ? tr('tooTangled') : tr('unsolvable'))); return; }
    if (!r.path.length || !spend(cost)) return;
    usedHint = true; clearHint(); setSel(-1); hint = r.path[0];
    if (els[hint[0]]) els[hint[0]].classList.add('hintsrc');
    if (els[hint[1]]) els[hint[1]].classList.add('hintdst');
    updHeader();
    toast(tr('hintShow') + (cost ? ' · −' + cost + ' ⭐' : ''));
  }, 30);
};

// Кнопка «назад» на Android (вызывается из WebView)
window.onAndroidBack = function () {
  if (!$('modal').hidden) { if (modalClose !== 'locked') closeModal(); return true; }
  if (!$('game').hidden) { leaveGame(); return true; }
  return false;
};
window.addEventListener('resize', () => { if (!$('game').hidden && !anims) renderAll(); });

// На сайте (GitHub Pages) — ссылки на APK и релизы; внутри приложения их нет
(function webLinks() {
  if (!/^https?:$/.test(location.protocol)) return;
  const m = location.hostname.match(/^([^.]+)\.github\.io$/), repo = location.pathname.split('/').filter(Boolean)[0];
  if (!m || !repo) return;
  const base = `https://github.com/${m[1]}/${repo}/releases`;
  $('apkLink').href = base + '/latest/download/Zelevar.apk'; $('relLink').href = base;
  $('webLinks').hidden = false;
})();
// ---------- Установка как веб-приложение (PWA) ----------
let installPrompt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (location.protocol === 'https:' && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (/^https?:$/.test(location.protocol) && !isStandalone()) $('installBtn').hidden = false;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
window.addEventListener('appinstalled', () => { installPrompt = null; $('installBtn').hidden = true; toast(tr('installed')); });
$('installBtn').onclick = async e => {
  e.preventDefault();
  if (installPrompt) {
    installPrompt.prompt();
    const r = await installPrompt.userChoice.catch(() => null);
    installPrompt = null;
    if (r && r.outcome === 'accepted') $('installBtn').hidden = true;
    return;
  }
  modal(`<div class="big">📲</div><h2>${tr('installTitle')}</h2><p>${tr(isIOS() ? 'installIOS' : 'installOther')}</p>
    <div class="btns"><button class="btn pri" onclick="closeModal()">${tr('gotIt')}</button></div>`);
};
applyI18n();
applyTheme();
showHome();
if (giftState().ready) setTimeout(() => { if (!$('home').hidden && $('modal').hidden) openGift(); }, 600);
if (IN_APP && S.updChecked !== today()) setTimeout(() => checkUpdate(false), 2500);

</script>
</body>
</html>
